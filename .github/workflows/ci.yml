# CI: run the same checks as scripts/check.sh on every push and PR.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Plugin checks
        run: bash scripts/check.sh
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh
